<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BaseTools - WalletConnect Builder Rewards</title>
  <script type="module">
    const { createAppKit } = await import('https://unpkg.com/@reown/appkit@1.7.7');
    const { base } = await import('https://unpkg.com/@reown/appkit/networks');
    const { ethers } = await import('https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js');
    window.ethers = ethers;
    window.createAppKit = createAppKit;
    window.base = base;
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f0f2f5;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 600px;
      width: 100%;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background: #4CAF50;
      border: none;
      border-radius: 5px;
      color: white;
      margin: 5px;
      transition: 0.3s;
    }
    button:hover {
      background: #45a049;
    }
    input, select {
      padding: 10px;
      font-size: 14px;
      margin: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      width: 100%;
      box-sizing: border-box;
    }
    .section {
      margin: 10px 0;
      display: none;
    }
    .section.active {
      display: block;
    }
    #status {
      margin-top: 10px;
      font-size: 14px;
      color: #333;
      word-wrap: break-word;
    }
    h2 {
      font-size: 20px;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>BaseTools: Utility Contracts</h2>
    <button id="connectBtn">Connect Wallet</button>
    <div id="connected" class="section">
      <p>Connected Address: <span id="address"></span></p>
      <div class="section" id="tipJar">
        <h3>TipJar</h3>
        <input id="tipAmount" type="number" placeholder="Tip Amount (ETH)" step="0.001">
        <button id="sendTipBtn">Send Tip</button>
      </div>
      <div class="section" id="votePoll">
        <h3>VotePoll</h3>
        <select id="voteOption">
          <option value="0">Option 1</option>
          <option value="1">Option 2</option>
          <option value="2">Option 3</option>
        </select>
        <button id="voteBtn">Vote</button>
      </div>
      <div class="section" id="simpleTimer">
        <h3>SimpleTimer</h3>
        <button id="startTimerBtn">Start Timer</button>
      </div>
      <div class="section" id="giveawayBox">
        <h3>GiveawayBox</h3>
        <button id="enterGiveawayBtn">Enter Giveaway</button>
      </div>
      <div class="section" id="storageUnit">
        <h3>StorageUnit</h3>
        <input id="storeValue" type="number" placeholder="Value to Store">
        <button id="storeBtn">Store Value</button>
      </div>
      <div class="section" id="randomPicker">
        <h3>RandomPicker</h3>
        <button id="enterRandomBtn">Enter Random Draw</button>
      </div>
      <div class="section" id="greetingCard">
        <h3>GreetingCard</h3>
        <input id="greetingMessage" type="text" placeholder="Enter Greeting">
        <button id="setGreetingBtn">Set Greeting</button>
      </div>
      <div class="section" id="tokenTracker">
        <h3>TokenTracker</h3>
        <input id="tokenAmount" type="number" placeholder="Token Amount">
        <button id="updateTokenBtn">Update Balance</button>
      </div>
      <div class="section" id="eventTracker">
        <h3>EventTracker</h3>
        <input id="eventName" type="text" placeholder="Event Name">
        <button id="logEventBtn">Log Event</button>
      </div>
      <div class="section" id="priceChecker">
        <h3>PriceChecker</h3>
        <input id="priceValue" type="number" placeholder="Price in Wei">
        <button id="updatePriceBtn">Update Price</button>
      </div>
      <div class="section" id="todoList">
        <h3>TodoList</h3>
        <input id="taskDescription" type="text" placeholder="Task Description">
        <button id="addTaskBtn">Add Task</button>
      </div>
      <div class="section" id="scoreboard">
        <h3>Scoreboard</h3>
        <input id="scoreValue" type="number" placeholder="Score">
        <button id="updateScoreBtn">Update Score</button>
      </div>
      <div class="section" id="profileBadge">
        <h3>ProfileBadge</h3>
        <input id="badgeName" type="text" placeholder="Badge Name">
        <button id="assignBadgeBtn">Assign Badge</button>
      </div>
      <div class="section" id="pollResultsViewer">
        <h3>PollResultsViewer</h3>
        <input id="pollOption" type="number" placeholder="Option Number">
        <input id="pollCount" type="number" placeholder="Vote Count">
        <button id="updatePollResultBtn">Update Result</button>
      </div>
      <div class="section" id="eventReminder">
        <h3>EventReminder</h3>
        <input id="reminderName" type="text" placeholder="Event Name">
        <input id="reminderTimestamp" type="number" placeholder="Timestamp">
        <button id="setReminderBtn">Set Reminder</button>
      </div>
      <div class="section" id="feedbackCollector">
        <h3>FeedbackCollector</h3>
        <input id="feedbackMessage" type="text" placeholder="Feedback">
        <button id="submitFeedbackBtn">Submit Feedback</button>
      </div>
      <div id="status"></div>
    </div>
  </div>

  <script type="module">
    const projectId = "0808ceb934963ee4f7d69774d29cb28a";
    const contracts = {
      TipJar: {
        address: "0xc1EFbf01F45E2291930ca1b4cFEE7ba7cA2a0389",
        abi: ["function tip() public payable", "event TipReceived(address indexed sender, uint256 amount)"]
      },
      VotePoll: {
        address: "0xE92Af969Eda2739d3892bD331912924203914649",
        abi: ["function vote(uint256 option) public", "event Voted(address indexed voter, uint256 option)"]
      },
      SimpleTimer: {
        address: "0xC17803c254831208B8a9c352a1B9e1b0c5d8e0e3",
        abi: ["function startTimer() public", "event TimerStarted(uint256 startTime, uint256 duration)"]
      },
      GiveawayBox: {
        address: "0x4Ed8afadBFb646be20B250574c5b088Aeed70E1c",
        abi: ["function enter() public", "event Entered(address indexed participant)"]
      },
      StorageUnit: {
        address: "0xbB5f6aB56147c3644A481FDC21196ca4A2EEe60D",
        abi: ["function store(uint256 value) public", "event ValueStored(address indexed user, uint256 value)"]
      },
      RandomPicker: {
        address: "0x9aDF3D4233A75cc330909aDC9b1A60bFC1567567",
        abi: ["function enter() public", "event Picked(address indexed winner)"]
      },
      GreetingCard: {
        address: "0xa27C3d38BCd9738eecA4f44E7259f1Ad9E605387",
        abi: ["function setGreeting(string memory message) public", "event GreetingSet(address indexed sender, string message)"]
      },
      TokenTracker: {
        address: "0xF717E1c9fca1d3BD1823907eF120dc7a619445a1",
        abi: ["function updateBalance(address user, uint256 amount) public", "event BalanceUpdated(address indexed user, uint256 amount)"]
      },
      EventTracker: {
        address: "0x70205809e4a0153A1a7fE165F24f83d32bd5DB3b",
        abi: ["function logEvent(string memory name) public", "event EventLogged(string name, uint256 timestamp)"]
      },
      PriceChecker: {
        address: "0x27c8D16d8Eba789eDB777A983e307D726bEC56fA",
        abi: ["function updatePrice(uint256 newPrice) public", "event PriceUpdated(uint256 newPrice)"]
      },
      TodoList: {
        address: "0xD080Ebc9b6207A5B6607690E5A98aA81A0F7774a",
        abi: ["function addTask(string memory description) public", "event TaskAdded(uint256 index, string description)"]
      },
      Scoreboard: {
        address: "0x3749c8E42c7D7A2E856Ab2272bd5DD0dCD530036",
        abi: ["function updateScore(uint256 score) public", "event ScoreUpdated(address indexed player, uint256 score)"]
      },
      ProfileBadge: {
        address: "0xE22fAEdE533f9b2d321B36f9a6CaAe91404A83ff",
        abi: ["function assignBadge(string memory badge) public", "event BadgeAssigned(address indexed user, string badge)"]
      },
      PollResultsViewer: {
        address: "0x5C0774903cD49e8a145E2A3900965cb4684C1C7C",
        abi: ["function updateResult(uint256 option, uint256 count) public", "event ResultUpdated(uint256 option, uint256 count)"]
      },
      EventReminder: {
        address: "0x707d306210a414cFD63EdcFe0fA11f2b37823b3e",
        abi: ["function setReminder(string memory eventName, uint256 timestamp) public", "event ReminderSet(address indexed user, string eventName, uint256 timestamp)"]
      },
      FeedbackCollector: {
        address: "0x57541598FD78DC06B9aDF135467fCDD103643262",
        abi: ["function submitFeedback(string memory message) public", "event FeedbackReceived(address indexed sender, string message)"]
      }
    };

    const appKit = await window.createAppKit({
      projectId: projectId,
      networks: [window.base],
      metadata: {
        name: "BaseTools",
        description: "Utility contracts on Base with WalletConnect",
        url: window.location.href,
        icons: ["https://reown.com/favicon.ico"]
      },
      features: {
        socials: ["google", "twitter"],
        email: true,
        swap: true,
        onramp: true,
        analytics: true,
        paymaster: true
      }
    });

    const connectBtn = document.getElementById("connectBtn");
    const statusDiv = document.getElementById("status");
    const connectedDiv = document.getElementById("connected");
    const addressSpan = document.getElementById("address");

    connectBtn.addEventListener("click", async () => {
      try {
        await appKit.open();
        statusDiv.textContent = "Opening WalletConnect modal...";
      } catch (err) {
        statusDiv.textContent = `Connection failed: ${err.message}`;
        console.error(err);
      }
    });

    appKit.on("connect", async ({ address }) => {
      statusDiv.textContent = `Connected: ${address}`;
      addressSpan.textContent = address;
      connectedDiv.classList.add("active");
      connectBtn.style.display = "none";
      Object.keys(contracts).forEach(key => document.getElementById(key.toLowerCase()).classList.add("active"));
    });

    appKit.on("disconnect", () => {
      statusDiv.textContent = "Disconnected";
      connectedDiv.classList.remove("active");
      connectBtn.style.display = "block";
      Object.keys(contracts).forEach(key => document.getElementById(key.toLowerCase()).classList.remove("active"));
    });

    const actions = [
      { id: "sendTipBtn", contract: "TipJar", fn: "tip", input: "tipAmount", process: (input) => ({ value: window.ethers.utils.parseEther(input), gasLimit: 100000 }) },
      { id: "voteBtn", contract: "VotePoll", fn: "vote", input: "voteOption", process: (input) => [parseInt(input)] },
      { id: "startTimerBtn", contract: "SimpleTimer", fn: "startTimer", input: null, process: () => [] },
      { id: "enterGiveawayBtn", contract: "GiveawayBox", fn: "enter", input: null, process: () => [] },
      { id: "storeBtn", contract: "StorageUnit", fn: "store", input: "storeValue", process: (input) => [parseInt(input)] },
      { id: "enterRandomBtn", contract: "RandomPicker", fn: "enter", input: null, process: () => [] },
      { id: "setGreetingBtn", contract: "GreetingCard", fn: "setGreeting", input: "greetingMessage", process: (input) => [input] },
      { id: "updateTokenBtn", contract: "TokenTracker", fn: "updateBalance", input: "tokenAmount", process: (input, address) => [address, parseInt(input)] },
      { id: "logEventBtn", contract: "EventTracker", fn: "logEvent", input: "eventName", process: (input) => [input] },
      { id: "updatePriceBtn", contract: "PriceChecker", fn: "updatePrice", input: "priceValue", process: (input) => [parseInt(input)] },
      { id: "addTaskBtn", contract: "TodoList", fn: "addTask", input: "taskDescription", process: (input) => [input] },
      { id: "updateScoreBtn", contract: "Scoreboard", fn: "updateScore", input: "scoreValue", process: (input) => [parseInt(input)] },
      { id: "assignBadgeBtn", contract: "ProfileBadge", fn: "assignBadge", input: "badgeName", process: (input) => [input] },
      { id: "updatePollResultBtn", contract: "PollResultsViewer", fn: "updateResult", input: ["pollOption", "pollCount"], process: (inputs) => [parseInt(inputs[0]), parseInt(inputs[1])] },
      { id: "setReminderBtn", contract: "EventReminder", fn: "setReminder", input: ["reminderName", "reminderTimestamp"], process: (inputs) => [inputs[0], parseInt(inputs[1])] },
      { id: "submitFeedbackBtn", contract: "FeedbackCollector", fn: "submitFeedback", input: "feedbackMessage", process: (input) => [input] }
    ];

    actions.forEach(({ id, contract, fn, input, process }) => {
      document.getElementById(id).addEventListener("click", async () => {
        try {
          const provider = new window.ethers.providers.Web3Provider(appKit.getProvider());
          const signer = provider.getSigner();
          const contractObj = new window.ethers.Contract(contracts[contract].address, contracts[contract].abi, signer);
          const inputValue = input ? (Array.isArray(input) ? input.map(i => document.getElementById(i).value) : document.getElementById(input).value) : null;
          const params = input ? process(inputValue, await signer.getAddress()) : process();
          const tx = await contractObj[fn](...params);
          statusDiv.textContent = `Tx sent: ${tx.hash}`;
          appKit.trackEvent({ name: `${contract}_${fn}`, properties: { address: contracts[contract].address } });
          await tx.wait();
          statusDiv.textContent = `Tx confirmed: ${tx.hash}`;
        } catch (err) {
          statusDiv.textContent = `Error: ${err.message}`;
          console.error(err);
        }
      });
    });
  </script>
</body>
</html>
