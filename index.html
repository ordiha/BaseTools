<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BaseTools - WalletConnect Builder Rewards</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background: #f0f2f5;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 600px;
      width: 100%;
    }
    .btn {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background: #4CAF50;
      border: none;
      border-radius: 5px;
      color: white;
      margin: 5px;
    }
    .btn:hover { background: #45a049; }
    input, select {
      padding: 10px;
      font-size: 14px;
      margin: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      width: 100%;
      box-sizing: border-box;
    }
    .addr, .chain { font-size: 14px; margin: 5px; }
    .card { margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    .status { font-size: 14px; color: #333; word-wrap: break-word; }
    h1 { font-size: 24px; margin: 10px 0; }
    h2 { font-size: 18px; margin: 10px 0 5px; }
    .lead { font-size: 16px; color: #555; }
    .foot { margin-top: 20px; text-align: center; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
  <script src="https://unpkg.com/@walletconnect/web3-provider@1.8.0/dist/umd/index.min.js"></script>
</head>
<body>
  <div class="container">
    <header class="top">
      <h1>🛠 BaseTools: Utility Contracts</h1>
      <p class="lead">Connect via WalletConnect or MetaMask to interact with Base contracts.</p>
      <div class="connect-row">
        <button id="btnConnect" class="btn">🔗 Connect Wallet</button>
        <div id="addr" class="addr">Not connected</div>
        <div id="chain" class="chain"></div>
      </div>
    </header>
    <main class="grid" id="cards">
      <!-- Contract cards injected dynamically -->
    </main>
    <footer class="foot">
      <div>Repo: <code>BaseTools</code></div>
      <div id="txLog" class="txlog"></div>
    </footer>
  </div>
  <script>
    let web3;
    let accounts;
    let provider;

    const contracts = [
      { name: "TipJar", address: "0xc1EFbf01F45E2291930ca1b4cFEE7ba7cA2a0389", method: "tip", type: "eth", inputId: "tipAmount" },
      { name: "VotePoll", address: "0xE92Af969Eda2739d3892bD331912924203914649", method: "vote", type: "number", inputId: "voteOption" },
      { name: "SimpleTimer", address: "0xC17803c254831208B8a9c352a1B9e1b0c5d8e0e3", method: "startTimer", type: "none", inputId: "" },
      { name: "GiveawayBox", address: "0x4Ed8afadBFb646be20B250574c5b088Aeed70E1c", method: "enter", type: "none", inputId: "" },
      { name: "StorageUnit", address: "0xbB5f6aB56147c3644A481FDC21196ca4A2EEe60D", method: "store", type: "number", inputId: "storeValue" },
      { name: "RandomPicker", address: "0x9aDF3D4233A75cc330909aDC9b1A60bFC1567567", method: "enter", type: "none", inputId: "" },
      { name: "GreetingCard", address: "0xa27C3d38BCd9738eecA4f44E7259f1Ad9E605387", method: "setGreeting", type: "string", inputId: "greetingMessage" },
      { name: "TokenTracker", address: "0xF717E1c9fca1d3BD1823907eF120dc7a619445a1", method: "updateBalance", type: "number", inputId: "tokenAmount" },
      { name: "EventTracker", address: "0x70205809e4a0153A1a7fE165F24f83d32bd5DB3b", method: "logEvent", type: "string", inputId: "eventName" },
      { name: "PriceChecker", address: "0x27c8D16d8Eba789eDB777A983e307D726bEC56fA", method: "updatePrice", type: "number", inputId: "priceValue" },
      { name: "TodoList", address: "0xD080Ebc9b6207A5B6607690E5A98aA81A0F7774a", method: "addTask", type: "string", inputId: "taskDescription" },
      { name: "Scoreboard", address: "0x3749c8E42c7D7A2E856Ab2272bd5DD0dCD530036", method: "updateScore", type: "number", inputId: "scoreValue" },
      { name: "ProfileBadge", address: "0xE22fAEdE533f9b2d321B36f9a6CaAe91404A83ff", method: "assignBadge", type: "string", inputId: "badgeName" },
      { name: "PollResultsViewer", address: "0x5C0774903cD49e8a145E2A3900965cb4684C1C7C", method: "updateResult", type: "number", inputId: ["pollOption", "pollCount"] },
      { name: "EventReminder", address: "0x707d306210a414cFD63EdcFe0fA11f2b37823b3e", method: "setReminder", type: "string", inputId: ["reminderName", "reminderTimestamp"] },
      { name: "FeedbackCollector", address: "0x57541598FD78DC06B9aDF135467fCDD103643262", method: "submitFeedback", type: "string", inputId: "feedbackMessage" }
    ];

    const cardsContainer = document.getElementById("cards");
    contracts.forEach(c => {
      const card = document.createElement("section");
      card.className = "card";
      card.innerHTML = `
        <h2>🛠 ${c.name}</h2>
        ${c.type !== "none" ? (Array.isArray(c.inputId) ? c.inputId.map(id => `<input id="${id}" placeholder="Enter ${id.replace(c.name.toLowerCase(), '').replace(/([A-Z])/g, ' $1').trim()}"/>`).join('') : `<input id="${c.inputId}" placeholder="${c.type === 'eth' ? 'ETH amount' : 'Enter text/number'}"/>`) : ""}
        <button id="btn_${c.name}">Call ${c.method}()</button>
        <div class="status" id="status_${c.name}"></div>
      `;
      cardsContainer.appendChild(card);
    });

    document.getElementById("btnConnect").addEventListener("click", async () => {
      try {
        if (window.ethereum) {
          provider = window.ethereum;
          await provider.request({ method: "eth_requestAccounts" });
          web3 = new Web3(provider);
          accounts = await web3.eth.getAccounts();
          showWallet(accounts[0]);
          return;
        }
        const WalletConnectProvider = window.WalletConnectProvider.default;
        provider = new WalletConnectProvider({ infuraId: "5056a2b581e5962f9e3083d68053b5d8" });
        await provider.enable();
        web3 = new Web3(provider);
        accounts = await web3.eth.getAccounts();
        showWallet(accounts[0]);
      } catch (err) {
        console.error(err);
        document.getElementById("txLog").innerText = `Failed to connect: ${err.message}`;
      }
    });

    function showWallet(addr) {
      document.getElementById("addr").innerText = addr;
      document.getElementById("chain").innerText = "Connected to Base";
    }

    contracts.forEach(c => {
      document.getElementById(`btn_${c.name}`).addEventListener("click", async () => {
        try {
          const input = c.type !== "none" ? (Array.isArray(c.inputId) ? c.inputId.map(id => document.getElementById(id).value) : document.getElementById(c.inputId).value) : null;
          const abi = [{
            "inputs": c.type === "none" ? [] : (Array.isArray(c.inputId) ? c.inputId.map((_, i) => ({
              internalType: c.type === "string" ? "string" : "uint256",
              name: `_param${i + 1}`,
              type: c.type === "string" ? "string" : "uint256"
            })) : [{
              internalType: c.type === "string" ? "string" : c.type === "eth" ? "uint256" : "uint256",
              name: "_param",
              type: c.type === "string" ? "string" : c.type === "eth" ? "uint256" : "uint256"
            }]),
            "name": c.method,
            "outputs": [],
            "stateMutability": c.type === "eth" ? "payable" : "nonpayable",
            "type": "function"
          }];
          const contract = new web3.eth.Contract(abi, c.address);
          let tx;
          if (c.type === "eth") {
            tx = await contract.methods[c.method]().send({ from: accounts[0], value: web3.utils.toWei(input, "ether") });
          } else if (c.type === "none") {
            tx = await contract.methods[c.method]().send({ from: accounts[0] });
          } else if (c.type === "string") {
            tx = await contract.methods[c.method](input).send({ from: accounts[0] });
          } else if (c.type === "number") {
            tx = await contract.methods[c.method](...[input].map(v => v)).send({ from: accounts[0] });
          } else if (Array.isArray(c.inputId)) {
            tx = await contract.methods[c.method](...input).send({ from: accounts[0] });
          }
          document.getElementById(`status_${c.name}`).innerText = `Tx: ${tx.transactionHash}`;
          document.getElementById("txLog").innerText = `Tx sent: ${tx.transactionHash}`;
        } catch (e) {
          console.error(e);
          document.getElementById(`status_${c.name}`).innerText = `Error: ${e.message}`;
          document.getElementById("txLog").innerText = `Error: ${e.message}`;
        }
      });
    });
  </script>
</body>
</html>
