<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BaseTools — WalletConnect-ready</title>

<!-- Ethers.js -->
<script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<!-- Web3Modal v2 UMD -->
<script src="https://unpkg.com/@web3modal/standalone@2.6.2/dist/index.umd.js"></script>

<style>
  body{font-family:sans-serif;background:#0f172a;color:#fff;margin:0;padding:20px}
  .btn{padding:8px 12px;background:#ffd166;border:none;border-radius:6px;cursor:pointer}
  .addr{font-family:monospace;font-size:13px}
  .status{font-size:13px;margin-top:6px;color:#9f9}
</style>
</head>
<body>
  <h1>BaseTools — WalletConnect-ready</h1>
  <p>Project ID: <b>ab89fbce996fcfa27b2c5b16fb73632f</b></p>
  <button id="btnConnect" class="btn">🔗 Connect Wallet</button>
  <div id="addr" class="addr">Not connected</div>
  <div id="status" class="status"></div>

<script>
const PROJECT_ID = "ab89fbce996fcfa27b2c5b16fb73632f";

let web3Modal, provider, ethersProvider, signer, account;

async function initWeb3Modal(){
  web3Modal = new window.Web3Modal({
    projectId: PROJECT_ID,
    walletConnectVersion: 2,
    chains: [{ chainId: 8453, name:"Base", rpcUrl:"https://mainnet.base.org" }],
    metadata: {
      name:"BaseTools",
      description:"BaseTools dapp",
      url:location.origin
    }
  });
}

document.getElementById('btnConnect').onclick = async () => {
  try {
    if (!web3Modal) await initWeb3Modal();
    provider = await web3Modal.connect();
    ethersProvider = new ethers.providers.Web3Provider(provider);
    signer = ethersProvider.getSigner();
    account = await signer.getAddress();
    document.getElementById('addr').innerText = account;
    document.getElementById('status').innerText = "Connected ✅";
  } catch(err){
    document.getElementById('status').innerText = "Connection failed: " + (err.message||err);
  }
};
</script>
</body>
</html>
